name: Validate packs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate pack structure
        run: python tools/validate_packs.py

      - name: Validate doctrine source structure
        run: python3 tools/validate_doctrine_sources.py

      - name: Installer and doctrine tests
        run: python3 -m unittest discover -s tests -v
