name: Validate packs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install optional orchestration test dependency
        run: python -m pip install -e '.[orchestration]'

      - name: Validate pack structure
        run: python tools/validate_packs.py

      - name: Validate doctrine source structure
        run: python3 tools/validate_doctrine_sources.py

      - name: Installer, doctrine, and orchestration tests
        run: python3 -m unittest discover -s tests -v
